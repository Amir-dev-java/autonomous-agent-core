[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-eng-core"
version = "0.1.0"
description = "A small, testable software-engineering workflow prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
autonomous-eng = "main:main"

[tool.setuptools]
py-modules = ["main", "config"]
packages = ["core", "roles", "tools"]

[tool.unittest]
start-directory = "tests"
